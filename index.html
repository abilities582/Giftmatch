<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gift Match</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --coral: #F96167;
    --coral-dark: #E8474D;
    --navy: #2F3C7E;
    --cream: #FFF8F0;
    --gold: #F9E795;
    --ink: #1F2433;
    --muted: #8A8F9E;
    --card: #FFFFFF;
    --border: #F0E6DA;
    --shadow: 0 4px 20px rgba(47, 60, 126, 0.08);
    --radius: 20px;
  }

  /* Тёмная тема Telegram */
  body.dark {
    --cream: #17181C;
    --ink: #F0F1F5;
    --muted: #8A8F9E;
    --card: #23252B;
    --border: #2E3138;
    --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Onest', -apple-system, sans-serif;
    background: var(--cream);
    color: var(--ink);
    overscroll-behavior: none;
    padding-bottom: 80px;
    transition: background 0.3s;
  }

  /* ===== HEADER ===== */
  .header {
    padding: 20px 18px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-mark {
    width: 46px; height: 46px;
    background: var(--coral);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Unbounded', sans-serif;
    font-weight: 800; font-size: 26px; color: #fff;
    position: relative;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(249, 97, 103, 0.35);
  }
  .logo-mark::after {
    content: ''; position: absolute; top: 8px; right: 8px;
    width: 8px; height: 8px; border-radius: 50%; background: var(--gold);
  }
  .logo-text { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 20px; line-height: 1; }
  .logo-text span { color: var(--coral); }
  .logo-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }

  /* ===== SCREENS ===== */
  .screen { display: none; padding: 0 18px; animation: fadeIn 0.35s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== AI SEARCH ===== */
  .ai-box {
    background: linear-gradient(135deg, var(--navy), #3D4A92);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 22px;
    position: relative;
    overflow: hidden;
  }
  .ai-box::before {
    content: '✨'; position: absolute; right: -10px; top: -10px;
    font-size: 80px; opacity: 0.12; transform: rotate(15deg);
  }
  .ai-title { color: #fff; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .ai-desc { color: rgba(255,255,255,0.7); font-size: 12.5px; margin-bottom: 12px; }
  .ai-input-row { display: flex; gap: 8px; }
  .ai-input {
    flex: 1; border: none; border-radius: 12px; padding: 12px 14px;
    font-family: 'Onest', sans-serif; font-size: 14px; background: rgba(255,255,255,0.95); color: var(--ink);
  }
  .ai-input:focus { outline: 2px solid var(--gold); }
  .ai-btn {
    background: var(--coral); border: none; border-radius: 12px;
    color: #fff; font-size: 20px; width: 46px; cursor: pointer; flex-shrink: 0;
    transition: transform 0.15s, background 0.2s;
  }
  .ai-btn:active { transform: scale(0.92); background: var(--coral-dark); }

  /* ===== DIVIDER ===== */
  .divider { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .divider span { font-size: 12px; color: var(--muted); font-weight: 500; }

  /* ===== FILTER GROUPS ===== */
  .filter-group { margin-bottom: 18px; }
  .filter-label { font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 9px; display: flex; align-items: center; gap: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 9px 15px; border-radius: 100px; border: 1.5px solid var(--border);
    background: var(--card); color: var(--ink); font-size: 13.5px; font-weight: 500;
    cursor: pointer; transition: all 0.18s; font-family: 'Onest', sans-serif;
  }
  .chip:active { transform: scale(0.95); }
  .chip.selected {
    background: var(--coral); border-color: var(--coral); color: #fff;
    box-shadow: 0 3px 10px rgba(249, 97, 103, 0.3);
  }

  /* ===== MAIN BUTTON ===== */
  .submit-btn {
    width: 100%; padding: 16px; border: none; border-radius: 16px;
    background: var(--coral); color: #fff;
    font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 15px;
    cursor: pointer; margin: 6px 0 24px;
    transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
    box-shadow: 0 6px 18px rgba(249, 97, 103, 0.35);
  }
  .submit-btn:active { transform: scale(0.98); }
  .submit-btn:disabled { opacity: 0.5; box-shadow: none; }

  /* ===== GIFT CARDS ===== */
  .results-title { font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 16px; margin: 4px 0 14px; }
  .card {
    background: var(--card); border-radius: var(--radius); padding: 16px;
    margin-bottom: 12px; box-shadow: var(--shadow); border: 1px solid var(--border);
    animation: cardIn 0.4s ease backwards;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .card-top { display: flex; gap: 13px; align-items: flex-start; }
  .card-emoji {
    width: 50px; height: 50px; border-radius: 14px; background: var(--cream);
    display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0;
  }
  .card-info { flex: 1; min-width: 0; }
  .card-name { font-weight: 600; font-size: 15px; line-height: 1.25; margin-bottom: 3px; }
  .card-price { font-size: 13px; color: var(--coral); font-weight: 600; }
  .card-fav {
    background: none; border: none; font-size: 22px; cursor: pointer; padding: 2px;
    transition: transform 0.2s; flex-shrink: 0;
  }
  .card-fav:active { transform: scale(1.3); }
  .card-desc { font-size: 13px; color: var(--muted); line-height: 1.45; margin: 11px 0 13px; }
  .buy-row { display: flex; gap: 7px; }
  .buy-link {
    flex: 1; text-align: center; padding: 9px; border-radius: 11px;
    background: var(--cream); color: var(--navy); font-size: 12.5px; font-weight: 600;
    text-decoration: none; border: 1px solid var(--border); transition: all 0.18s;
  }
  .buy-link:active { background: var(--coral); color: #fff; }
  body.dark .buy-link { color: var(--gold); }

  /* ===== EMPTY STATE ===== */
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-emoji { font-size: 54px; margin-bottom: 14px; opacity: 0.7; }
  .empty-text { font-size: 14px; line-height: 1.5; }

  /* ===== LOADER ===== */
  .loader { text-align: center; padding: 30px; display: none; }
  .loader.show { display: block; }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border);
    border-top-color: var(--coral); border-radius: 50%;
    margin: 0 auto 10px; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-text { font-size: 13px; color: var(--muted); }

  /* ===== BOTTOM NAV ===== */
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card); border-top: 1px solid var(--border);
    display: flex; padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
    z-index: 100;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: none; cursor: pointer; padding: 6px; color: var(--muted);
    font-family: 'Onest', sans-serif; font-size: 11px; font-weight: 500; transition: color 0.2s;
  }
  .nav-item.active { color: var(--coral); }
  .nav-icon { font-size: 22px; }

  .history-item {
    background: var(--card); border-radius: 14px; padding: 13px 15px; margin-bottom: 10px;
    border: 1px solid var(--border); font-size: 13.5px;
  }
  .history-meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .history-date { font-size: 11px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>

<div class="header">
  <div class="logo-mark">G</div>
  <div>
    <div class="logo-text">Gift<span>Match</span></div>
    <div class="logo-sub">Идеальный подарок за 2 минуты</div>
  </div>
</div>

<!-- ЭКРАН: ПОДБОР -->
<div class="screen active" id="screen-picker">
  <div class="ai-box">
    <div class="ai-title">✨ Опишите словами</div>
    <div class="ai-desc">Например: «парень, любит горы, кофе и фотографию»</div>
    <div class="ai-input-row">
      <input class="ai-input" id="ai-input" placeholder="Кому ищем подарок?" maxlength="200">
      <button class="ai-btn" id="ai-go">→</button>
    </div>
  </div>

  <div class="divider"><span>или подберите по фильтрам</span></div>

  <div id="filters"></div>

  <button class="submit-btn" id="submit">🎁 Подобрать подарок</button>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    <div class="loader-text" id="loader-text">Подбираем варианты…</div>
  </div>

  <div id="results"></div>
</div>

<!-- ЭКРАН: ИЗБРАННОЕ -->
<div class="screen" id="screen-fav">
  <div id="fav-list"></div>
</div>

<!-- ЭКРАН: ИСТОРИЯ -->
<div class="screen" id="screen-history">
  <div id="history-list"></div>
</div>

<!-- НИЖНЯЯ НАВИГАЦИЯ -->
<div class="nav">
  <button class="nav-item active" data-screen="picker"><span class="nav-icon">🎁</span>Подбор</button>
  <button class="nav-item" data-screen="fav"><span class="nav-icon">⭐</span>Избранное</button>
  <button class="nav-item" data-screen="history"><span class="nav-icon">🕐</span>История</button>
</div>

// ====== TELEGRAM INIT ======
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  if (tg.colorScheme === 'dark') document.body.classList.add('dark');
  tg.onEvent('themeChanged', () => {

function haptic(type='light') { try { tg?.HapticFeedback?.impactOccurred(type); } catch(e){} }

// ====== КОНФИГ ФИЛЬТРОВ ======
const FILTERS = {
  recipient: { label: '👤 Кому дарим?', options: [

  ]},

    ['birthday','День рождения'],['newyear','Новый год'],['valentines','14 февраля'],['march8','8 марта'],['general','Без повода']
  ]},
  price: { label: '💰 Бюджет', options: [
    ['0-1000','До 1000 ₽'],['1000-3000','1–3 тыс ₽'],['3000-5000','3–5 тыс ₽'],['5000-10000','5–10 тыс ₽'],['10000-100000','От 10 тыс ₽']
  ]},
  focus: { label: '❤️ Что важнее', options: [

  ]},
  character: { label: '🎭 Характер', options: [

  ]},
};
const selected = {};

// ====== РЕНДЕР ФИЛЬТРОВ ======
const filtersEl = document.getElementById('filters');
for (const [key, cfg] of Object.entries(FILTERS)) {
  const group = document.createElement('div');
  group.className = 'filter-group';
  group.innerHTML = `<div class="filter-label">${cfg.label}</div>`;
  const chips = document.createElement('div');
  chips.className = 'chips';
  cfg.options.forEach(([val, text]) => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = text;
    chip.onclick = () => {
      haptic();
      if (selected[key] === val) { delete selected[key]; chip.classList.remove('selected'); }
      else {
        selected[key] = val;
        chips.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
        chip.classList.add('selected');

    };
    chips.appendChild(chip);
  });
  group.appendChild(chips);
  filtersEl.appendChild(group);

// ====== АЛГОРИТМ ПОДБОРА ======
function findGifts(f) {
  let pmin = 0, pmax = 100000;
  if (f.price) { const [a,b] = f.price.split('-').map(Number); pmin = a; pmax = b; }
  const cand = GIFTS.filter(g => {
    if (f.recipient && !g.rec.includes(f.recipient)) return false;
    if (g.pmax < pmin || g.pmin > pmax) return false;
    return true;
  });
  const scored = cand.map(g => {
    let s = 0;
    if (f.occasion && g.occ.includes(f.occasion)) s += 3;
    if (f.focus && g.tags.includes(f.focus)) s += 2;
    if (f.character && g.tags.includes(f.character)) s += 2;
    if (g.pmin >= pmin && g.pmax <= pmax) s += 1;
    return { g, s: s + Math.random() };
  });
  scored.sort((a,b) => b.s - a.s);
  return scored.slice(0, 5).map(x => x.g);
}

// ====== ССЫЛКИ КУПИТЬ ======
const UTM = 'utm_source=giftmatch_miniapp&utm_medium=telegram';
function buyLinks(name) {
  const q = encodeURIComponent(name);
  return {
    'Ozon': `https://www.ozon.ru/search/?text=${q}&${UTM}`,
    'WB': `https://www.wildberries.ru/catalog/0/search.aspx?search=${q}`,
    'Я.Маркет': `https://market.yandex.ru/search?text=${q}`,
  };
}

// ====== РЕНДЕР КАРТОЧКИ ======
function giftCard(g, idx) {
  const price = `${g.pmin.toLocaleString('ru')}–${g.pmax.toLocaleString('ru')} ₽`;
  const links = buyLinks(g.name);
  const isFav = favorites.some(f => f.name === g.name);
  const linksHtml = Object.entries(links).map(([shop,url]) =>
    `<a class="buy-link" href="${url}" target="_blank" onclick="haptic()">🛒 ${shop}</a>`).join('');
  const card = document.createElement('div');
  card.className = 'card';
  card.style.animationDelay = (idx * 0.07) + 's';
  card.innerHTML = `
    <div class="card-top">
      <div class="card-emoji">${g.emoji}</div>
      <div class="card-info">
        <div class="card-name">${g.name}</div>
        <div class="card-price">${price}</div>
      </div>
      <button class="card-fav" data-name="${g.name.replace(/"/g,'&quot;')}">${isFav ? '❤️' : '🤍'}</button>
    </div>
    <div class="card-desc">${g.desc}</div>
    <div class="buy-row">${linksHtml}</div>
  `;
  card.querySelector('.card-fav').onclick = (e) => toggleFav(g, e.target);
  return card;
}

// ====== ПОДБОР ПО ФИЛЬТРАМ ======
document.getElementById('submit').onclick = () => {
  haptic('medium');
  const gifts = findGifts(selected);
  showResults(gifts, 'По вашим фильтрам');
  saveHistory(selected, gifts);
};

function showResults(gifts, title) {
  const res = document.getElementById('results');
  res.innerHTML = '';
  if (!gifts.length) {
    res.innerHTML = `<div class="empty"><div class="empty-emoji">🤔</div><div class="empty-text">Под эти параметры ничего не нашлось.<br>Попробуйте изменить бюджет или фокус.</div></div>`;
    return;
  }
  const h = document.createElement('div');
  h.className = 'results-title';
  h.textContent = `✨ ${title} (${gifts.length})`;
  res.appendChild(h);
  gifts.forEach((g, i) => res.appendChild(giftCard(g, i)));
  res.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ====== AI-ПОИСК ======
// Запрос идёт на backend (см. flask_ai_endpoint.py). Укажите свой адрес:
const AI_API_URL = 'https://canariodeoro.pythonanywhere.com/api/ai-suggest';

document.getElementById('ai-go').onclick = runAI;
document.getElementById('ai-input').addEventListener('keydown', e => { if (e.key === 'Enter') runAI(); });

async function runAI() {
  const text = document.getElementById('ai-input').value.trim();
  if (!text) return;
  haptic('medium');
  const loader = document.getElementById('loader');
  const results = document.getElementById('results');
  results.innerHTML = '';
  loader.classList.add('show');
  document.getElementById('loader-text').textContent = 'AI подбирает идеи…';
  try {
    const resp = await fetch(AI_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ description: text }),
    });
    const data = await resp.json();
    loader.classList.remove('show');
    if (data.gifts && data.gifts.length) {
      // AI возвращает {name, description, price} — приводим к нашему формату
      const gifts = data.gifts.map(g => ({
        name: g.name, desc: g.description || '',
        emoji: g.emoji || '🎁',
        pmin: 0, pmax: 0, priceText: g.price || '',
        rec: [], occ: [], tags: [],
      }));
      showResultsAI(gifts);
    } else {
      results.innerHTML = `<div class="empty"><div class="empty-emoji">😶</div><div class="empty-text">AI не дал ответа. Попробуйте переформулировать или воспользуйтесь фильтрами.</div></div>`;
    }
  } catch (e) {
    loader.classList.remove('show');
    results.innerHTML = `<div class="empty"><div class="empty-emoji">⚠️</div><div class="empty-text">AI пока недоступен (не настроен сервер).<br>Воспользуйтесь подбором по фильтрам.</div></div>`;
  }
}

function showResultsAI(gifts) {
  const res = document.getElementById('results');
  res.innerHTML = '';
  const h = document.createElement('div');
  h.className = 'results-title';
  h.textContent = `✨ AI подобрал (${gifts.length})`;
  res.appendChild(h);
  gifts.forEach((g, i) => {
    const links = buyLinks(g.name);
    const linksHtml = Object.entries(links).map(([shop,url]) =>
      `<a class="buy-link" href="${url}" target="_blank" onclick="haptic()">🛒 ${shop}</a>`).join('');
    const isFav = favorites.some(f => f.name === g.name);
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = (i * 0.07) + 's';
    card.innerHTML = `
      <div class="card-top">
        <div class="card-emoji">${g.emoji}</div>
        <div class="card-info">
          <div class="card-name">${g.name}</div>
          <div class="card-price">${g.priceText || ''}</div>
        </div>
        <button class="card-fav">${isFav ? '❤️' : '🤍'}</button>
      </div>
      <div class="card-desc">${g.desc}</div>
      <div class="buy-row">${linksHtml}</div>`;
    card.querySelector('.card-fav').onclick = (e) => toggleFav(g, e.target);
    res.appendChild(card);
  });
}

// ====== ИЗБРАННОЕ (Telegram CloudStorage) ======
let favorites = [];
let history = [];

function cloudGet(key, cb) {
  if (tg?.CloudStorage) tg.CloudStorage.getItem(key, (err, val) => cb(val ? JSON.parse(val) : []));
  else { const v = localStorage.getItem(key); cb(v ? JSON.parse(v) : []); }
}
function cloudSet(key, value) {
  const json = JSON.stringify(value);
  if (tg?.CloudStorage) tg.CloudStorage.setItem(key, json);
  else localStorage.setItem(key, json);
}

function toggleFav(g, btn) {
  haptic();
  const idx = favorites.findIndex(f => f.name === g.name);
  if (idx >= 0) { favorites.splice(idx, 1); if (btn) btn.textContent = '🤍'; }
  else { favorites.push({ name: g.name, desc: g.desc, emoji: g.emoji, priceText: g.priceText || `${g.pmin}–${g.pmax} ₽` }); if (btn) btn.textContent = '❤️'; }
  cloudSet('favorites', favorites);
  renderFav();
}

function renderFav() {
  const el = document.getElementById('fav-list');
  if (!favorites.length) {
    el.innerHTML = `<div class="empty"><div class="empty-emoji">⭐</div><div class="empty-text">Здесь будут подарки,<br>которые вы добавите в избранное.</div></div>`;
    return;
  }
  el.innerHTML = '<div class="results-title">⭐ Избранное</div>';
  favorites.forEach((g, i) => {
    const links = buyLinks(g.name);
    const linksHtml = Object.entries(links).map(([shop,url]) =>
      `<a class="buy-link" href="${url}" target="_blank" onclick="haptic()">🛒 ${shop}</a>`).join('');
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = (i * 0.05) + 's';
    card.innerHTML = `
      <div class="card-top">
        <div class="card-emoji">${g.emoji}</div>
        <div class="card-info">
          <div class="card-name">${g.name}</div>
          <div class="card-price">${g.priceText || ''}</div>
        </div>
        <button class="card-fav">❤️</button>
      </div>
      <div class="card-desc">${g.desc}</div>
      <div class="buy-row">${linksHtml}</div>`;
    card.querySelector('.card-fav').onclick = (e) => {
      const idx = favorites.findIndex(f => f.name === g.name);
      if (idx >= 0) favorites.splice(idx, 1);
      cloudSet('favorites', favorites);
      renderFav();
      haptic();
    };
    el.appendChild(card);
  });
}

// ====== ИСТОРИЯ ======
function saveHistory(filters, gifts) {
  const RECIPIENT = {boyfriend:'Парень',girlfriend:'Девушка',mom:'Мама',dad:'Папа',colleague:'Коллега'};
  const OCCASION = {birthday:'День рождения',newyear:'Новый год',valentines:'14 февраля',march8:'8 марта',general:'Без повода'};
  history.unshift({
    recipient: RECIPIENT[filters.recipient] || '—',
    occasion: OCCASION[filters.occasion] || '—',
    gifts: gifts.map(g => g.name),
    date: new Date().toLocaleString('ru', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }),
  });
  history = history.slice(0, 20);
  cloudSet('history', history);
}

function renderHistory() {
  const el = document.getElementById('history-list');
  if (!history.length) {
    el.innerHTML = `<div class="empty"><div class="empty-emoji">🕐</div><div class="empty-text">Здесь будет история<br>ваших подборов.</div></div>`;
    return;
  }
  el.innerHTML = '<div class="results-title">🕐 История подборов</div>';
  history.forEach(h => {
    const item = document.createElement('div');
    item.className = 'history-item';
    item.innerHTML = `
      <div><b>${h.recipient}</b> · ${h.occasion}</div>
      <div class="history-meta">🎁 ${h.gifts.slice(0,3).join(', ')}${h.gifts.length > 3 ? ' и ещё ' + (h.gifts.length-3) : ''}</div>
      <div class="history-date">${h.date}</div>`;
    el.appendChild(item);
  });
}

// ====== НАВИГАЦИЯ ======
document.querySelectorAll('.nav-item').forEach(btn => {
  btn.onclick = () => {
    haptic();
    const screen = btn.dataset.screen;
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('screen-' + screen).classList.add('active');
    if (screen === 'fav') renderFav();
    if (screen === 'history') renderHistory();
  };
});

// ====== ЗАГРУЗКА ДАННЫХ ПРИ СТАРТЕ ======
cloudGet('favorites', (data) => { favorites = data || []; });
cloudGet('history', (data) => { history = data || []; });
